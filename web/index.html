<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ExoPlanets Map</title>
<style>
  :root {
    --bg: #07080c; --panel: rgba(14,16,24,0.92); --line: rgba(255,255,255,0.12);
    --text: #e9e7f2; --muted: #9a97ab; --accent: #ffffff;
    --track: rgba(255,255,255,0.16); --fill: #c9b8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; touch-action: none; }
  #map canvas { position: absolute; left: 0; top: 0; display: block; }
  #map canvas:first-child { cursor: grab; touch-action: none; }
  #map canvas:first-child:active { cursor: grabbing; }
  #map .overlay { pointer-events: none; }
  #mapctl { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  #mapctl button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: 600 16px/1 -apple-system, Segoe UI, sans-serif; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #mapctl #tiltBtn { font-size: 13px; }
  .howto { color: var(--muted); font-size: 11px; margin: -6px 0 12px; }

  #panel { position: fixed; top: 16px; left: 16px; width: 320px; max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .seg { display: flex; background: rgba(255,255,255,0.06); border-radius: 9px; padding: 3px; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 6px; border-radius: 7px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .seg button.on { background: rgba(255,255,255,0.14); color: var(--text); }

  .filter { margin-bottom: 14px; }
  .frow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .fname { font-weight: 600; font-size: 13px; }
  .fval { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .range { position: relative; height: 26px; margin-top: 8px; }
  .range .track, .range .fillbar { position: absolute; top: 11px; height: 4px; border-radius: 2px; }
  .range .track { left: 0; right: 0; background: var(--track); }
  .range .fillbar { background: var(--fill); }
  .range input { position: absolute; left: 0; top: 0; width: 100%; height: 26px; margin: 0; background: none;
    -webkit-appearance: none; appearance: none; pointer-events: none; }
  .range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; border: 2px solid var(--fill); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .range input::-moz-range-thumb { pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    border: 2px solid var(--fill); cursor: pointer; }
  .range input::-webkit-slider-runnable-track { background: none; }
  .range input::-moz-range-track { background: none; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 1px; display: flex; justify-content: space-between; gap: 8px; }
  .group { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 4px 0 8px;
    padding-top: 10px; border-top: 1px solid var(--line); }
  .group:first-child { border-top: 0; padding-top: 0; }
  .range .tick { position: absolute; top: 5px; width: 2px; height: 16px; margin-left: -1px; background: #fff; border-radius: 1px;
    opacity: .85; pointer-events: none; z-index: 1; }
  .range .ticklbl { position: absolute; top: -9px; transform: translateX(-50%); font-size: 10px; color: #fff; opacity: .8;
    pointer-events: none; white-space: nowrap; }
  .est-toggle { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .est-toggle input { margin: 0; accent-color: var(--fill); }
  .filter.idle .fval { opacity: .7; }

  .counts { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--muted); }
  .counts b { color: var(--text); font-size: 14px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 10px 0 8px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1.5px #000; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #zoomMatches { flex-basis: 100%; }
  .btns button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px;
    padding: 7px; font: inherit; font-size: 12px; cursor: pointer; }
  #collapse { display: none; }

  #card { position: fixed; right: 16px; top: 16px; width: 290px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; display: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #card h2 { font-size: 15px; margin: 0 0 2px; padding-right: 22px; }
  #card .sys { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 12.5px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #card .est { color: var(--muted); font-size: 11px; }
  #card .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }

  #tip { position: fixed; pointer-events: none; background: rgba(0,0,0,.8); border: 1px solid var(--line); color: var(--text);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  @media (max-width: 700px) {
    #panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; border-radius: 14px 14px 0 0; max-height: 45%; padding: 12px 14px; }
    #panel.min .body { display: none; }
    #collapse { display: block; position: absolute; right: 12px; top: 10px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; }
    #card { left: 12px; right: 12px; top: 12px; width: auto; }
    #mapctl { top: 12px; bottom: auto; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="mapctl">
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <button id="tiltBtn" aria-label="Tilt the map">3D</button>
</div>
<div id="loading">Loading map…</div>

<div id="panel">
  <button id="collapse">Hide</button>
  <h1>Exoplanets around the Sun</h1>
  <div class="sub" id="sub">NASA Exoplanet Archive</div>
  <div class="body">
    <div class="seg" id="views">
      <button data-view="solar" class="on">Near the Sun (20,000 ly)</button>
      <button data-view="full">Whole galaxy</button>
    </div>
    <div class="howto">Drag to move · Scroll or pinch to zoom · Right-drag, Ctrl-drag, or two-finger drag to tilt</div>
    <div id="filters"></div>
    <div class="counts" id="counts"></div>
    <div class="legend" id="legend"></div>
    <div class="btns">
      <button id="zoomMatches">Zoom to shown planets</button>
      <button id="resetFilters">Reset sliders</button>
      <button id="resetView">Reset view</button>
    </div>
  </div>
</div>

<div id="card"><button class="x" id="cardClose" aria-label="Close">×</button><div id="cardBody"></div></div>
<div id="tip"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from './vendor/three/controls/MapControls.js';
{
  // ---------- 3D map space ----------
  // World units are light-years, with the Sun at 0,0,0. The galaxy lies flat on the X–Z plane.
  // Planet data: x_ly points to the galaxy's center, y_ly the way the Sun travels, z_ly up out of the disk.
  // On the map the galaxy's center is "up" (−Z), the Sun's direction of travel is left (−X),
  // and height above the disk is +Y.  So: world = (−y_ly, z_ly, −x_ly).
  const PX_PER_LY = 378 / (8.2 * 3261.56);            // galaxy image: Sun 378 px below center; 8.2 kpc
  const GALAXY = { src: 'images/milky_way_full_1920.jpg', size: 1920 / PX_PER_LY,
                   cx: (960 - 957.7) / PX_PER_LY, cz: (960 - 1320.7) / PX_PER_LY };
  const REGION = { src: 'images/solar_region_20kly_4096.webp', size: 20000, px: 4096 };
  // The detailed image fades in once the galaxy image starts to look blurry
  const FADE_START = 280, FADE_END = 700;                // region width on screen, in device pixels
  const MAX_PX_PER_LY = 20;                              // closest zoom: 1 light-year = 20 px
  const MAX_TILT = 60 * Math.PI / 180;                   // camera can tilt from top-down to 60°
  const FOV = 40;

  const COLORS = {
    'Transit': '#55dcff', 'Radial Velocity': '#ffc83c', 'Imaging': '#9dff78',
    'Microlensing': '#ff5ac8', 'Other': '#ffffff'
  };
  const colorFor = m => COLORS[m] || COLORS.Other;


  const state = { planets: [], hidden: 0, selected: null, hover: null, filterVer: 0 };
  let dirty = true;
  const redraw = () => { dirty = true; };

  // ---------- Sliders ----------
  // Two handles each. Most use a log scale because the values span huge ranges.
  // required: planets without this value are never shown (the first three sliders).
  // Other sliders hide planets without a value only while that slider is in use.
  // ref: Earth's (or the Sun's) value, drawn as a white tick on the track.
  // estimate: which values count as estimates for the "Hide estimates" switch.
  const FILTERS = [
    { group: 'Location' },
    { key: 'dist', unit: ' ly', name: 'Distance from Earth', min: 4, max: 30000, scale: 'log', required: true,
      get: p => p.dist, fmt: v => `${fmtNum(v)} ly`, hint: 'Light-years from Earth' },
    { group: 'Planet' },
    { key: 'size', unit: ' × Earth', name: 'Planet size', min: 0.3, max: 80, scale: 'log', required: true, ref: 1, refLabel: 'Earth',
      get: p => p.size, fmt: v => `${fmtNum(v)}× Earth`, hint: 'Radius compared to Earth' },
    { key: 'mass', unit: ' × Earth', name: 'Planet mass', min: 0.03, max: 13000, scale: 'log', ref: 1, refLabel: 'Earth',
      get: p => p.raw.planet_mass_earths, fmt: v => `${fmtNum(v)}× Earth`, hint: 'Compared to Earth',
      estimate: p => ['estimated from size', 'upper limit', 'lower limit'].includes(p.raw.planet_mass_source) },
    { key: 'grav', unit: ' × Earth', name: 'Surface gravity', min: 0.03, max: 100, scale: 'log', ref: 1, refLabel: 'Earth',
      get: p => p.raw.surface_gravity_earths, fmt: v => `${fmtNum(v)}× Earth`, hint: 'How heavy you would feel',
      estimate: p => p.raw.surface_gravity_source === 'uses estimated values' },
    { key: 'light', unit: ' × Earth', name: 'Starlight received', min: 0.001, max: 100000, scale: 'log', ref: 1, refLabel: 'Earth',
      get: p => p.raw.starlight_earths, fmt: v => `${fmtNum(v)}× Earth`, hint: 'Energy from its star, compared to Earth' },
    { group: 'Star' },
    { key: 'temp', unit: ' × Sun', name: 'Star temperature', min: 0.09, max: 10, scale: 'log', required: true, ref: 1, refLabel: 'Sun',
      get: p => p.temp, fmt: v => `${fmtNum(v)}× Sun`, hint: 'Compared to our Sun (5,772 K)' },
    { key: 'age', unit: ' billion yrs', name: 'Star age', min: 0, max: 14, scale: 'linear', ref: 4.6, refLabel: 'Sun',
      get: p => p.raw.star_age_gyr, fmt: v => `${fmtNum(v)} billion yrs`, hint: 'Our Sun is 4.6 billion years old' },
  ];
  const SLIDERS = FILTERS.filter(f => f.key);
  const STEPS = 1000;
  const toVal = (f, t) => f.scale === 'log' ? f.min * Math.pow(f.max / f.min, t / STEPS) : f.min + (f.max - f.min) * t / STEPS;
  const toT = (f, v) => f.scale === 'log' ? STEPS * Math.log(v / f.min) / Math.log(f.max / f.min) : STEPS * (v - f.min) / (f.max - f.min);
  function fmtNum(v) {
    if (v == null) return '–';
    const trim = t => t.includes('.') ? t.replace(/\.?0+$/, '') : t;
    if (v >= 1000) return Math.round(v).toLocaleString();
    if (v >= 100) return v.toFixed(0);
    if (v >= 10) return trim(v.toFixed(1));
    if (v >= 0.01 || v === 0) return trim(v.toFixed(2));
    return trim(v.toPrecision(2));
  }

  // ---------- Build slider UI ----------
  const filtersEl = document.getElementById('filters');
  FILTERS.forEach(f => {
    const el = document.createElement('div');
    if (f.group) { el.className = 'group'; el.textContent = f.group; filtersEl.appendChild(el); return; }
    el.className = 'filter';
    const refPct = f.ref != null ? toT(f, f.ref) / STEPS * 100 : null;
    el.innerHTML = `<div class="frow"><span class="fname">${f.name}</span><span class="fval"></span></div>
      <div class="range"><div class="track"></div><div class="fillbar"></div>
      ${refPct != null ? `<div class="tick" style="left:${refPct}%"></div><div class="ticklbl" style="left:${refPct}%">${f.refLabel}</div>` : ''}
      <input type="range" min="0" max="${STEPS}" value="0" aria-label="${f.name} minimum">
      <input type="range" min="0" max="${STEPS}" value="${STEPS}" aria-label="${f.name} maximum"></div>
      <div class="hint"><span>${f.hint}</span>${f.estimate ? `<label class="est-toggle"><input type="checkbox"> Hide estimates</label>` : ''}</div>`;
    filtersEl.appendChild(el);
    const [lo, hi] = el.querySelectorAll('.range input');
    const fill = el.querySelector('.fillbar'), label = el.querySelector('.fval');
    const est = el.querySelector('.est-toggle input');
    f.ui = { lo, hi, est };
    const update = (moved) => {
      let a = +lo.value, b = +hi.value;
      if (a > b) { if (moved === lo) lo.value = a = b; else hi.value = b = a; }
      f.active = a > 0 || b < STEPS;
      f.lo = toVal(f, a); f.hi = toVal(f, b);
      fill.style.left = (a / STEPS * 100) + '%';
      fill.style.width = ((b - a) / STEPS * 100) + '%';
      // Always show the real range, unit written once. A handle at the far right also
      // includes anything above it, so that end gets a "+" (for example "4 – 30,000+ ly").
      label.textContent = `${fmtNum(f.lo)} – ${fmtNum(f.hi)}${b === STEPS ? '+' : ''}${f.unit}`;
      el.classList.toggle('idle', !f.active);
      // Keep the active handle on top so the two handles never get stuck under each other
      const loTop = moved === lo || a >= STEPS - 5;
      lo.style.zIndex = loTop ? 3 : 2; hi.style.zIndex = loTop ? 2 : 3;
      applyFilters(); redraw();
    };
    lo.addEventListener('input', () => update(lo));
    hi.addEventListener('input', () => update(hi));
    if (est) est.addEventListener('change', () => { applyFilters(); redraw(); });
    f.update = update;
  });
  document.getElementById('resetFilters').onclick = () => {
    SLIDERS.forEach(f => { f.ui.lo.value = 0; f.ui.hi.value = STEPS; if (f.ui.est) f.ui.est.checked = false; f.update(); });
  };
  document.getElementById('legend').innerHTML = Object.entries(COLORS)
    .map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('');

  // ---------- Filtering ----------
  // A planet is shown when, for every slider that is in use, it has a value inside the range
  // (and, if "Hide estimates" is on, that value isn't an estimate). The ends of each slider
  // are open: at the far left or right, values beyond the slider's range still count.
  function applyFilters() {
    let match = 0, noData = 0;
    const active = SLIDERS.filter(f => f.active || (f.ui.est && f.ui.est.checked));
    const names = new Set();
    for (const p of state.planets) {
      let ok = true, missing = false;
      for (const f of active) {
        const v = f.get(p);
        if (v == null) { ok = false; missing = true; names.add(f.name); continue; }
        const loOK = +f.ui.lo.value === 0 || v >= f.lo, hiOK = +f.ui.hi.value === STEPS || v <= f.hi;
        if (!loOK || !hiOK) ok = false;
        if (f.ui.est && f.ui.est.checked && f.estimate(p)) ok = false;
      }
      p.match = ok;
      if (ok) match++; else if (missing) noData++;
    }
    document.getElementById('counts').innerHTML =
      `<div><b>${match.toLocaleString()}</b> planets shown</div>` +
      (noData ? `<div>${noData.toLocaleString()} more hidden because they have no data for ${[...names].join(', ').toLowerCase()}</div>` : '') +
      `<div>${state.hidden.toLocaleString()} always hidden: missing planet size or star temperature</div>`;
    state.filterVer++;
  }


  // ---------- Renderer, camera, controls ----------
  const mapEl = document.getElementById('map');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000);   // matches the black around the galaxy image
  mapEl.appendChild(renderer.domElement);
  const overlay = document.createElement('canvas'); overlay.className = 'overlay';
  mapEl.appendChild(overlay);
  const octx = overlay.getContext('2d');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 1e7);
  const controls = new MapControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.12;
  controls.zoomToCursor = true; controls.zoomSpeed = 1.3;
  controls.minPolarAngle = 0; controls.maxPolarAngle = MAX_TILT;      // tilt limits
  controls.minAzimuthAngle = 0; controls.maxAzimuthAngle = 0;         // no spinning: galaxy center stays up
  controls.rotateSpeed = 0.6;

  // The open map area is the part of the screen not covered by the panel. The camera's
  // center line is aimed at the middle of that area, so the orbit point sits there.
  const view = { W: 1, H: 1, left: 0, bottom: 0, fullW: 1, fullH: 1 };
  function layout() {
    const W = innerWidth, H = innerHeight, wide = W > 700;
    const panel = document.getElementById('panel');
    view.W = W; view.H = H;
    view.left = wide ? 352 : 0;
    view.bottom = wide ? 0 : Math.min(panel.getBoundingClientRect().height, H * 0.5);
    view.fullW = W + view.left; view.fullH = H + view.bottom;
    renderer.setSize(W, H);
    const dpr = renderer.getPixelRatio();
    overlay.width = W * dpr; overlay.height = H * dpr; overlay.style.width = W + 'px'; overlay.style.height = H + 'px';
    camera.aspect = view.fullW / view.fullH;
    // Window into a bigger virtual view whose center is the center of the open area
    camera.setViewOffset(view.fullW, view.fullH, 0, view.bottom, W, H);
    const tanHalf = Math.tan(FOV * Math.PI / 360);
    controls.minDistance = view.fullH / (2 * tanHalf * MAX_PX_PER_LY);
    controls.maxDistance = fitDistance(GALAXY.size * 1.6);
    dirty = true;
  }
  const tanHalf = () => Math.tan(FOV * Math.PI / 360);
  // Distance at which a square of `size` light-years fits the open area
  function fitDistance(size) {
    const openW = view.W - view.left, openH = view.H - view.bottom;
    const pxPerLy = Math.min(openW, openH) * 0.96 / size;
    return view.fullH / (2 * tanHalf() * pxPerLy);
  }
  const camDist = () => camera.position.distanceTo(controls.target);
  const pxPerLy = () => view.fullH / (2 * tanHalf() * camDist());   // scale at the orbit point
  const tilt = () => { const o = camera.position.clone().sub(controls.target); return Math.acos(Math.min(1, o.y / o.length())); };

  // Keep the orbit point on the galaxy
  controls.addEventListener('change', () => {
    const t = controls.target, h = GALAXY.size / 2;
    const cx = Math.max(GALAXY.cx - h, Math.min(GALAXY.cx + h, t.x)), cz = Math.max(GALAXY.cz - h, Math.min(GALAXY.cz + h, t.z));
    if (cx !== t.x || cz !== t.z) { camera.position.x += cx - t.x; camera.position.z += cz - t.z; t.x = cx; t.z = cz; }
    dirty = true;
  });

  // ---------- Background images ----------
  const loader = new THREE.TextureLoader();
  function imagePlane(src, size, cx, cz, order, transparent) {
    const tex = loader.load(src, () => { dirty = true; });
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent, depthTest: false, depthWrite: false });
    const geo = new THREE.PlaneGeometry(size, size); geo.rotateX(-Math.PI / 2);   // image top → galaxy center (−Z)
    const mesh = new THREE.Mesh(geo, mat); mesh.position.set(cx, 0, cz); mesh.renderOrder = order;
    scene.add(mesh); return mat;
  }
  const galaxyMat = imagePlane(GALAXY.src, GALAXY.size, GALAXY.cx, GALAXY.cz, 0, false);
  const regionMat = imagePlane(REGION.src, REGION.size, 0, 0, 1, true);

  // ---------- Planets: dots at their real 3D positions, plus height lines when tilted ----------
  const srgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  const pointMat = new THREE.ShaderMaterial({
    uniforms: { uSize: { value: 4 }, uDpr: { value: 1 } },
    vertexShader: `attribute vec3 rgb; varying vec3 vRgb; uniform float uSize;
      void main() { vRgb = rgb; gl_PointSize = uSize; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vRgb; uniform float uSize; uniform float uDpr;
      void main() {
        float d = length(gl_PointCoord * 2.0 - 1.0);
        if (d > 1.0) discard;
        float rim = 1.0 - (0.7 * uDpr) / (uSize * 0.5);   // thin dark outline, about 0.7 px
        gl_FragColor = d > rim ? vec4(0.0, 0.0, 0.0, 0.75) : vec4(vRgb, 1.0);
      }`,
    transparent: true, depthTest: false, depthWrite: false,
  });
  const pointGeo = new THREE.BufferGeometry();
  const points = new THREE.Points(pointGeo, pointMat); points.renderOrder = 3; points.frustumCulled = false; scene.add(points);
  const stemMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
  const stemGeo = new THREE.BufferGeometry();
  const stems = new THREE.LineSegments(stemGeo, stemMat); stems.renderOrder = 2; stems.frustumCulled = false; scene.add(stems);
  const ORDER = ['Transit', 'Other', 'Radial Velocity', 'Imaging', 'Microlensing'];   // drawn last = on top
  let shown = [];
  function rebuildPlanets() {
    shown = state.planets.filter(p => p.match).sort((a, b) => ORDER.indexOf(a.group) - ORDER.indexOf(b.group));
    const pos = new Float32Array(shown.length * 3), rgb = new Float32Array(shown.length * 3);
    const spos = new Float32Array(shown.length * 6), scol = new Float32Array(shown.length * 6);
    const c = new THREE.Color();
    shown.forEach((p, i) => {
      pos.set([p.wx, p.wy, p.wz], i * 3); rgb.set(p.rgb, i * 3);
      spos.set([p.wx, 0, p.wz, p.wx, p.wy, p.wz], i * 6);
      c.setStyle(colorFor(p.group)); scol.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6);
    });
    pointGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    pointGeo.setAttribute('rgb', new THREE.BufferAttribute(rgb, 3));
    stemGeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
    stemGeo.setAttribute('color', new THREE.BufferAttribute(scol, 3));
    dirty = true;
  }

  // ---------- Per-frame updates ----------
  const v3 = new THREE.Vector3();
  function project(x, y, z) {          // world → screen px (null if behind the camera)
    v3.set(x, y, z).project(camera);
    if (v3.z > 1) return null;
    return [(v3.x + 1) / 2 * view.W, (1 - v3.y) / 2 * view.H];
  }
  const dotRadius = k => Math.max(1.2, Math.min(3, 1.2 + 0.65 * Math.log2(Math.max(1, k / 860))));
  let lastRegionOpacity = 1;
  function render() {
    const d = camDist();
    camera.near = Math.max(0.05, d * 0.005); camera.far = d * 20 + GALAXY.size * 2;
    camera.updateProjectionMatrix();
    const ppl = pxPerLy(), regionW = REGION.size * ppl;
    // Fade the detailed image in as you zoom toward the Sun
    const regionDevPx = regionW * renderer.getPixelRatio();   // phones have 2–3 device pixels per point
    let a = Math.max(0, Math.min(1, (regionDevPx - FADE_START) / (FADE_END - FADE_START))); a = a * a * (3 - 2 * a);
    regionMat.opacity = a; regionMat.visible = a > 0; lastRegionOpacity = a;
    // Past the detail image's real resolution, darken the blurry background
    const dim = Math.max(0, Math.min(1, Math.log2((regionDevPx / REGION.px) / 3) / 3)) * 0.5;
    galaxyMat.color.setScalar(1 - dim); regionMat.color.setScalar(1 - dim);
    // Dot size (screen px), and height lines that appear as you tilt
    const r = dotRadius(regionW);
    pointMat.uniforms.uSize.value = (r + 0.6) * 2 * renderer.getPixelRatio();
    pointMat.uniforms.uDpr.value = renderer.getPixelRatio();
    const t = tilt() / MAX_TILT;
    stemMat.opacity = Math.max(0, Math.min(1, (t - 0.05) / 0.3)) * 0.2; stems.visible = stemMat.opacity > 0;
    renderer.render(scene, camera);
    drawOverlay(ppl, r);
    viewBtns.forEach(b => b.classList.toggle('on', (b.dataset.view === 'solar') === (a > 0.5)));
    document.getElementById('tiltBtn').textContent = tilt() > 0.05 ? '2D' : '3D';
  }

  // Sun marker, selection rings and scale bar, drawn flat on top of the 3D view
  function drawOverlay(ppl, r) {
    const dpr = renderer.getPixelRatio();
    octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, view.W, view.H);
    octx.font = '600 12px -apple-system, Segoe UI, sans-serif';
    // Hovered and selected planets
    for (const [p, col] of [[state.hover, 'rgba(255,255,255,.7)'], [state.selected, '#fff']]) {
      if (!p || !p.match) continue;
      const s = project(p.wx, p.wy, p.wz); if (!s) continue;
      octx.strokeStyle = col; octx.lineWidth = 1.5; octx.beginPath(); octx.arc(s[0], s[1], r + 4, 0, Math.PI * 2); octx.stroke();
    }
    // The Sun
    const sun = project(0, 0, 0);
    if (sun) {
      octx.lineWidth = 1.5; octx.strokeStyle = '#fff';
      octx.beginPath(); octx.arc(sun[0], sun[1], 7, 0, Math.PI * 2); octx.stroke();
      octx.fillStyle = '#fff'; octx.beginPath(); octx.arc(sun[0], sun[1], 1.8, 0, Math.PI * 2); octx.fill();
      octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.85)';
      octx.strokeText('Sun', sun[0] + 11, sun[1] + 4); octx.fillText('Sun', sun[0] + 11, sun[1] + 4);
    }
    // Scale bar: a round number of light-years, 60–150 px long (measured at the map's center)
    let ly = 1;
    outer: for (let e = 0; e < 7; e++) for (const m of [1, 2, 5]) { ly = m * 10 ** e; if (ly * ppl >= 60) break outer; }
    const lbl = `${ly.toLocaleString()} light-year${ly === 1 ? '' : 's'}${tilt() > 0.05 ? ' (at center)' : ''}`;
    const len = ly * ppl, room = Math.max(len, octx.measureText(lbl).width);
    const bx = view.W - 72 - room / 2 - len / 2, by = view.H - view.bottom - 28;
    octx.strokeStyle = '#fff'; octx.lineWidth = 2;
    octx.beginPath(); octx.moveTo(bx, by - 5); octx.lineTo(bx, by); octx.lineTo(bx + len, by); octx.lineTo(bx + len, by - 5); octx.stroke();
    octx.textAlign = 'center'; octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.85)'; octx.fillStyle = '#fff';
    octx.strokeText(lbl, bx + len / 2, by - 9); octx.fillText(lbl, bx + len / 2, by - 9); octx.textAlign = 'start';
  }

  let lastVer = -1;
  function tick() {
    const moved = controls.update();
    if (state.filterVer !== lastVer) { lastVer = state.filterVer; rebuildPlanets(); }
    if (moved || dirty) { dirty = false; render(); }
    requestAnimationFrame(tick);
  }

  // ---------- Smooth camera moves (view buttons, zoom buttons, 2D/3D) ----------
  let anim = 0;
  function flyTo({ x = controls.target.x, z = controls.target.z, dist = camDist(), phi = tilt() }, ms = 900) {
    cancelAnimationFrame(anim);
    const from = { x: controls.target.x, z: controls.target.z, dist: camDist(), phi: tilt() }, t0 = performance.now();
    dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, dist));
    const set = (X, Z, D, P) => {
      controls.target.set(X, 0, Z);
      camera.position.set(X, D * Math.cos(P), Z + D * Math.sin(P) + 1e-6 * D);
      controls.update(); dirty = true;
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { set(x, z, dist, phi); return; }
    const step = now => {
      let t = Math.min(1, (now - t0) / ms); t = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      set(from.x + (x - from.x) * t, from.z + (z - from.z) * t,
          from.dist * Math.pow(dist / from.dist, t), from.phi + (phi - from.phi) * t);
      if (t < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  renderer.domElement.addEventListener('pointerdown', () => cancelAnimationFrame(anim));
  renderer.domElement.addEventListener('wheel', () => cancelAnimationFrame(anim), { passive: true });

  // ---------- Hover and tap ----------
  function pick(sx, sy, maxDist) {
    let best = null, bd = maxDist * maxDist;
    for (const p of shown) {
      const s = project(p.wx, p.wy, p.wz); if (!s) continue;
      const dd = (s[0] - sx) ** 2 + (s[1] - sy) ** 2;
      if (dd < bd) { bd = dd; best = p; }
    }
    return best;
  }
  const tip = document.getElementById('tip');
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, n: (down?.n || 0) + 1 }; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5 && e.button === 0)
      select(pick(e.clientX, e.clientY, e.pointerType === 'touch' ? 22 : 10));
    down = null;
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (e.buttons || e.pointerType === 'touch') { tip.style.display = 'none'; return; }
    const p = pick(e.clientX, e.clientY, 10);
    if (p !== state.hover) { state.hover = p; dirty = true; }
    if (p) { tip.style.display = 'block'; tip.textContent = p.name; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
    else tip.style.display = 'none';
  });
  renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; if (state.hover) { state.hover = null; dirty = true; } });

  // ---------- Detail card ----------
  const nm = '<span class="est">Not measured</span>';
  function select(p) {
    state.selected = p; redraw();
    const card = document.getElementById('card');
    if (!p) { card.style.display = 'none'; return; }
    const r = p.raw;
    const est = s => (s && s !== 'measured') ? `<div class="est">${s}</div>` : '';
    document.getElementById('cardBody').innerHTML = `
      <h2>${p.name}</h2><div class="sys">Star system: ${r.star_system} · Found by ${p.method}</div>
      <dl>
        <dt>Distance from Earth</dt><dd>${fmtNum(p.dist)} ly</dd>
        <dt>Planet size</dt><dd>${fmtNum(p.size)}× Earth${est(r.planet_size_source)}</dd>
        <dt>Planet mass</dt><dd>${r.planet_mass_earths == null ? nm : fmtNum(r.planet_mass_earths) + '× Earth'}${est(r.planet_mass_source)}</dd>
        <dt>Surface gravity</dt><dd>${r.surface_gravity_earths == null ? nm : fmtNum(r.surface_gravity_earths) + '× Earth'}${est(r.surface_gravity_source)}</dd>
        <dt>Starlight received</dt><dd>${r.starlight_earths == null ? nm : fmtNum(r.starlight_earths) + '× Earth'}${est(r.starlight_source)}</dd>
        <dt>Distance from its star</dt><dd>${r.star_distance_au == null ? nm : fmtNum(r.star_distance_au) + ' AU'}</dd>
        <dt>Star type</dt><dd>${r.star_type == null ? nm : r.star_type}${est(r.star_type_source)}</dd>
        <dt>Star temperature</dt><dd>${Math.round(r.star_temp_k).toLocaleString()} K<div class="est">${fmtNum(p.temp)}× Sun</div></dd>
        <dt>Star size</dt><dd>${r.star_size_suns == null ? nm : fmtNum(r.star_size_suns) + '× Sun'}</dd>
        <dt>Star age</dt><dd>${r.star_age_gyr == null ? nm : fmtNum(r.star_age_gyr) + ' billion yrs'}${est(r.star_age_source)}</dd>
      </dl>${(() => {
        const sib = state.planets.filter(q => q !== p && q.raw.star_system === r.star_system);
        if (!sib.length) return '';
        return `<div class="sys" style="margin:10px 0 0">Also around this star (same spot on the map):<br>` +
          sib.map(q => q.match ? q.name : `${q.name} <span class="est">(filtered out)</span>`).join('<br>') + '</div>';
      })()}`;
    card.style.display = 'block';
  }
  document.getElementById('cardClose').onclick = () => select(null);


  // ---------- Buttons ----------
  const viewBtns = document.querySelectorAll('#views button');
  const nearView = () => ({ x: 0, z: 0, dist: fitDistance(REGION.size) });
  const galaxyView = () => ({ x: GALAXY.cx, z: GALAXY.cz, dist: fitDistance(GALAXY.size) });
  viewBtns.forEach(b => b.onclick = () => flyTo(b.dataset.view === 'solar' ? nearView() : galaxyView()));
  document.getElementById('resetView').onclick = () => flyTo({ ...nearView(), phi: 0 });
  document.getElementById('zoomIn').onclick = () => flyTo({ dist: camDist() / 2 }, 400);
  document.getElementById('zoomOut').onclick = () => flyTo({ dist: camDist() * 2 }, 400);
  document.getElementById('tiltBtn').onclick = () => flyTo({ phi: tilt() > 0.05 ? 0 : 45 * Math.PI / 180 }, 700);
  // Frame the Sun and every planet currently shown (at least 20 light-years across)
  document.getElementById('zoomMatches').onclick = () => {
    let x0 = 0, x1 = 0, z0 = 0, z1 = 0;
    for (const p of state.planets) if (p.match) {
      x0 = Math.min(x0, p.wx); x1 = Math.max(x1, p.wx); z0 = Math.min(z0, p.wz); z1 = Math.max(z1, p.wz);
    }
    const size = Math.max(x1 - x0, z1 - z0, 20) * 1.15;
    flyTo({ x: (x0 + x1) / 2, z: (z0 + z1) / 2, dist: fitDistance(size) });
  };
  document.getElementById('collapse').onclick = e => {
    const pnl = document.getElementById('panel'); pnl.classList.toggle('min');
    e.target.textContent = pnl.classList.contains('min') ? 'Show filters' : 'Hide';
    layout();
  };
  window.addEventListener('resize', layout);

  // ---------- Load data ----------
  fetch('data/planets_web.json').then(r => r.json()).then(data => {
    const F = data.fields;
    state.hidden = data.planets_hidden_missing_data;
    state.planets = data.planets.map(row => {
      const r = Object.fromEntries(F.map((f, i) => [f, row[i]]));
      const group = COLORS[r.found_by] ? r.found_by : 'Other';
      return { name: r.planet_name, method: r.found_by, group, rgb: srgb(colorFor(group)),
               dist: r.distance_ly, size: r.planet_size_earths, temp: r.star_temp_k / data.sun_temp_k, raw: r,
               wx: -r.y_ly, wy: r.z_ly, wz: -r.x_ly };
    });
    document.getElementById('sub').textContent = `NASA Exoplanet Archive · downloaded ${data.nasa_download}`;
    document.getElementById('loading').remove();
    layout();
    const v = nearView();
    controls.target.set(0, 0, 0); camera.position.set(0, v.dist, 1e-6 * v.dist); controls.update();
    SLIDERS.forEach(f => f.update());
    tick();
  }).catch(err => { document.getElementById('loading').textContent = 'Could not load the map data: ' + err; });
}
</script>

</body>
</html>
